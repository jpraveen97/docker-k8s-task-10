apiVersion: apps/v1
kind: Deployment
metadata:
  name: task-10-app
  labels:
    app: task-10-app

spec:
  replicas: 2

  selector:
    matchLabels:
      app: task-10-app

  template:
    metadata:
      labels:
        app: task-10-app

    spec:
      containers:
        - name: task-10-container
          image: jpraveen97/task-10-app:latest
          imagePullPolicy: Always

          ports:
            - containerPort: 3006

          env:
            - name: PORT
              value: "3006"

            - name: APP_VERSION
              value: "v1"